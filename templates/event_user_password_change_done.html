{% extends "base.html" %}
{% block profile %}
<div class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="bg-white shadow-lg rounded-2xl p-8 max-w-md text-center">
    <!-- Success Icon -->
    <div class="flex justify-center mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M9 12l2 2l4-4m6 2a9 9 0 11-18 0a9 9 0 0118 0z" />
      </svg>
    </div>

    <!-- Title -->
    <h2 class="text-2xl font-bold text-gray-800 mb-2">Password Changed!</h2>
    <p class="text-gray-600 mb-6">
      Your password has been updated successfully.
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-col gap-3">
      <!-- Change password again -->
      <a href="{% url 'sign_in' %}" 
         class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
         Change Password Again
      </a>

      <!-- Back to profile -->
      <a href="{% url 'main_dashbord' %}" 
         class="w-full bg-gray-200 text-gray-700 py-2 rounded-lg hover:bg-gray-300 transition">
        Back to Home
      </a>
    </div>
  </div>

</div>
{% endblock content %}
