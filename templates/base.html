<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Event Management{% endblock %}</title>

    <!-- Bootstrap CSS (keep only one) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
     <link href="https://cdn.tailwindcss.com" rel="stylesheet">

    {% comment %} {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}"> {% endcomment %}

    <style>
        /* Navbar style */
        .navbar-nav .nav-link {
            color: red !important;
            font-size: 18px; 
        }
        .navbar-nav .nav-link:hover {
            color: yellow !important; 
        }

        /* Event table row hover */
        .event-row:hover {
            background-color: #ffe6eb; /* light pink */
            transition: background-color 0.3s;
        }

        /* Optional: card hover for future use */
        .event-card {
            transition: transform 0.3s;
        }
        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Event Management</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Center Menu -->
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link active" href="{% url 'main_dashbord' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'event' %}">Event</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'booking' %}">Booking</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
                </ul>

                <!-- Right Side Menu -->
                <ul class="navbar-nav">
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'sign_out' %}?next={{ request.path }}">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'sign_up' %}">
                                <i class="fas fa-user"></i> Sign Up
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'sign_in' %}">
                                <i class="fas fa-sign-in-alt"></i> Login
                            </a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        {% block content %}{% endblock content %}
    </div>

    {% include 'footer.html' %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
   
</body>
</html>
