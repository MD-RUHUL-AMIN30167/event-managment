<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manager Profile - {{ name }}</title>
   
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="flex flex-col min-h-screen bg-gray-50">

  <!-- Header -->
  <header class="bg-gradient-to-r from-purple-500 to-indigo-600 text-white shadow-md p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Event Management</h1>
      <nav class="space-x-4">
        {% if user.is_authenticated %}
          <a href="{% url 'profile' %}" class="hover:underline">Profile</a>
          <a href="{% url 'edit_profile' %}" class="hover:underline">Edit Profile</a>
          <a href="{% url 'password_change' %}" class="hover:underline">Password Change</a>
        {% else %}
         <div class="mt-4 text-center">
         <button onclick="history.back()" 
        class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">
        Back
           </button>
        </div>
        {% endif %}
      </nav>
    </div>
  </header>

  <!-- Main content -->
  <main class="flex-1 container mx-auto p-6 md:p-10">
      {% block profile %}{% endblock profile %}
  </main>

  <!-- Footer -->
  <footer class="bg-gray-200 text-gray-700 text-center p-4 mt-6 shadow-inner">
    <p>© {{ year|default:"2025" }} Event Management System. All rights reserved.</p>
  </footer>

</body>
</html>
