<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADMIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex flex-col min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-md">
      <nav class="mx-auto px-6 py-10 text-white bg-black shadow-lg">
        <div class="flex justify-between items-center">
          <a href="index.html" class="text-xl font-bold text-white">ADMIN </a>
          <div class="hidden md:flex space-x-4">
              
                  <a href="{% url 'main_dashbord' %}" class="text-white hover:text-red-800 text-xl">Events</a>
                  <a href="{% url 'create_event' %}" class="text-white hover:text-red-800 text-xl">Create Event</a>
                  <a href="{% url 'admin_list' %}" class="text-white hover:text-red-800 text-xl">Users</a>
                  <a href="{% url 'category' %}" class="text-white hover:text-red-800 text-xl">Category</a>
                  <a href="{% url 'create_group' %}" class="text-white hover:text-red-800 text-xl">Create Group</a>
                  <a href="{% url 'groups_list' %}" class="text-white hover:text-red-800 text-xl">Groups List</a>

       
            </div>


          <div class="flex items-center">
            <div class="relative">
              <button id="user-menu-button" class="flex items-center focus:outline-none">
                <img class="h-8 w-8 rounded-full object-cover"
                     src="https://placekitten.com/100/100"
                     alt="User avatar"/>
              </button>
              
              <div id="user-menu" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 hidden">
                <a href="{% url 'all_event' %}" class="block px-4 py-2 text-lg text-gray-500 hover:bg-green-500">Dashboard</a>
                
              <form method="post" action="{% url 'sign_out' %}">
                {% csrf_token %}
                <button type="submit" class="block px-4 py-2 text-lg text-gray-500 hover:bg-red-500">
                  Logout
                </button>
              </form>
              </div>
            </div>
            <div class="md:hidden ml-4">
              <button id="menu-toggle" class="text-gray-600 hover:text-gray-800 focus:outline-none">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                     xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6h16M4 12h16m-7 6h7"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div id="mobile-menu" class="md:hidden hidden mt-6 bg-black">
          <a href="{% url 'main_dashbord' %}" class="block py-2 px-4 text-white hover:bg-green-500">Event</a>
          <a href="{% url 'create_event' %}" class="block py-2 px-4 text-white hover:bg-green-500">Create Event</a>
          <a href="{% url 'admin_list' %}" class="block py-2 px-4 text-white hover:bg-green-500">Users</a>
          <a href="{% url 'category' %}" class="block py-2 px-4 text-white hover:bg-green-500">Category</a>
          <a href="{% url 'create_group' %}" class="block py-2 px-4 text-white hover:bg-green-500">Create Group</a>
          <a href="{% url 'groups_list' %}" class="block py-2 px-4 text-white hover:bg-green-500">Groups List</a>
        </div>
      </nav>
    </header>

    <!-- Main content -->
    <main class="flex-grow my-4">
      {% block admin %}{% endblock admin %}
    </main>

    <!-- Footer -->
    {% include "admin/admin_footer.html" %}

    <script>
      document.getElementById("menu-toggle").addEventListener("click", function () {
        document.getElementById("mobile-menu").classList.toggle("hidden");
      });

      document.getElementById("user-menu-button").addEventListener("click", function () {
        document.getElementById("user-menu").classList.toggle("hidden");
      });

      window.addEventListener("click", function (e) {
        if (!document.getElementById("user-menu-button").contains(e.target)) {
          document.getElementById("user-menu").classList.add("hidden");
        }
      });
    </script>
  </body>
</html>
